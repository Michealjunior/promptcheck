<!doctype html>
<!-- Source for site/og.png (1200x630). Regenerate with headless Chrome:
     chrome --headless=new --screenshot=site/og.png --window-size=1200,630 file://$PWD/docs/og-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>promptcheck social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@500&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-color: #04070a; color: #d6e4ec; font-family: "Inter", system-ui, sans-serif;
    background-image:
      radial-gradient(700px 400px at 90% 0%, rgba(0, 225, 255, 0.14), transparent 65%),
      radial-gradient(700px 420px at 0% 100%, rgba(0, 255, 157, 0.12), transparent 65%),
      linear-gradient(rgba(0, 255, 157, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 157, 0.05) 1px, transparent 1px);
    background-size: auto, auto, 44px 44px, 44px 44px;
    background-repeat: no-repeat, no-repeat, repeat, repeat;
  }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(0, 255, 157, 0.18); border-radius: 20px; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 26px; height: 26px; border: 0 solid #00ff9d; }
  .frame::before { top: 16px; left: 16px; border-top-width: 3px; border-left-width: 3px; }
  .frame::after { right: 16px; bottom: 16px; border-right-width: 3px; border-bottom-width: 3px; }
  .content { position: absolute; left: 96px; right: 96px; top: 96px; }
  .brand { display: flex; align-items: center; gap: 16px; font: 700 34px/1 "Chakra Petch", sans-serif; color: #eef6fa; }
  .kicker { margin-top: 64px; color: #00ff9d; font: 600 20px/1 "JetBrains Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; }
  h1 { margin: 18px 0 0; font: 700 76px/1.04 "Chakra Petch", sans-serif; color: #eef6fa; }
  h1 span { color: #00ff9d; }
  p { margin: 24px 0 0; font-size: 28px; color: #8193a3; }
  .chips { position: absolute; left: 96px; bottom: 92px; display: flex; gap: 12px; }
  .chips span { padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(0, 255, 157, 0.3); background: #0a1218;
    font: 500 19px/1 "JetBrains Mono", monospace; color: #d6e4ec; }
  .chips .fail { border-color: rgba(255, 46, 136, 0.5); color: #ff8fbf; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="52" height="52" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ff9d"/><stop offset="1" stop-color="#00e1ff"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M8.5 16.5l4.8 4.8L23.5 11" fill="none" stroke="#04070a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      promptcheck
    </div>
    <div class="kicker">// LLM regression testing</div>
    <h1>Regression tests for <span>LLM prompts</span>.</h1>
    <p>Catch silent breakage before your users do.</p>
  </div>
  <div class="chips">
    <span>json_valid</span><span>json_field</span><span>max_words</span><span>not_refusal</span><span class="fail">✗ got "high"</span>
  </div>
</body>
</html>
