[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "promptcheck"
version = "0.1.0"
description = "Regression tests for LLM prompts. Catch silent breakage before your users do."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ayeni Oluwaferanmi Micheal" }]
keywords = ["llm", "prompt", "testing", "evaluation", "regression", "ci", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
promptcheck = "promptcheck.cli:main"

[project.urls]
Homepage = "https://michealjunior.github.io/promptcheck/"
Source = "https://github.com/Michealjunior/promptcheck"
Issues = "https://github.com/Michealjunior/promptcheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptcheck"]

[tool.hatch.build.targets.sdist]
include = ["src/promptcheck", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
